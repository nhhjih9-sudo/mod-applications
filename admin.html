<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1a2e;--card:#12233d;--text:#f3efe2;--muted:#aab4c4;--accent:#d4af37;--line:#243a5e;--title:#d4af37;--field:#0c1a2e;--fline:#3a5078;--ink:#0c1a2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',Tahoma,sans-serif;padding:24px 14px}
.wrap{max-width:780px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
h2{color:var(--title)}
input{width:100%;background:var(--field);color:var(--text);border:1px solid var(--fline);border-radius:10px;padding:12px;font:inherit;margin-bottom:10px}
input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,175,55,.22)}
button{background:var(--accent);color:var(--ink);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.1)}
.ok{background:#16a34a;color:#fff}.no{background:#dc2626;color:#fff}.warn{background:#d97706;color:#fff}
.ghost{background:#243a5e;color:var(--text)}
.discord{background:#5865f2;color:#fff;width:100%;padding:12px}
.tab.on{background:var(--accent);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.f{margin:7px 0;line-height:1.7}.f b{color:var(--muted);font-weight:500}
.badge{padding:3px 12px;border-radius:20px;font-size:13px;font-weight:500}
.pending{background:#4a3d10;color:#f3e08a}.accepted{background:#14391f;color:#86efac}.rejected{background:#4a1c1c;color:#fca5a5}
.retry{background:#1e2f5a;color:#c7d2fe}.banned{background:#5b1c1c;color:#fecaca}
.ip{direction:ltr;display:inline-block;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-family:monospace}
.hide{display:none}
.or{text-align:center;color:var(--muted);margin:14px 0;font-size:14px}
#err{color:#f87171;margin-top:8px}
.owner-in{flex:1;min-width:140px;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card" style="border-top:5px solid var(--accent)">
    <h2 style="margin-top:0">🔐 دخول الإدارة</h2>
    <button id="dl" class="discord">الدخول عبر ديسكورد</button>
    <div class="or">أو بالكود</div>
    <input id="pass" type="password" placeholder="كود الدخول">
    <button id="go">دخول</button>
    <div id="err"></div>
  </div>
  <div id="panel" class="hide">
    <div class="card row" style="border-top:5px solid var(--accent);margin-bottom:12px">
      <button id="ownerBtn" class="warn hide">👑 قائمة الأدمن</button>
      <h2 style="margin:0;flex:1">🛡️ طلبات المود</h2>
      <button id="tg"></button>
      <button class="ghost" id="out">خروج</button>
    </div>
    <div id="ownerBox" class="card hide">
      <h3 style="margin:0 0 6px;color:var(--title)">👑 قائمة الأدمن</h3>
      <div class="f" style="color:var(--muted);font-size:14px">الأشخاص هنا يدخلون اللوحة عبر ديسكورد بدون كود. مالك السيرفر والرتب المحددة في Cloudflare مسموح لهم دائماً.</div>
      <div id="adminList"></div>
      <div class="row" style="margin:12px 0 0">
        <input id="aid" class="owner-in" placeholder="Discord ID للشخص" inputmode="numeric">
        <input id="aname" class="owner-in" placeholder="الاسم (اختياري)">
        <button id="aadd" class="ok">إضافة</button>
      </div>
    </div>
    <div class="row" id="tabs"></div>
    <div id="list"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const CLIENT_ID='1569634081916981268';
const WORKER_URL='https://ancient-butterfly-5aa6.nhhjih9.workers.dev/';
const ADMIN_REDIRECT='https://nhhjih9-sudo.github.io/mod-applications/admin.html';

const $=id=>document.getElementById(id);
const LABELS={all:'الكل',pending:'قيد المراجعة',accepted:'مقبول',rejected:'مرفوض',bans:'المحظورون'};
let filter='pending',docs=[],bans={},isOpen=true,CODE='',OWNER='',admins=[],sel=new Set(),prog='';

function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e}
async function adm(fn){const b=db.batch();b.set(db.doc('sessions/admin'),{code:CODE});fn(b);await b.commit()}
function run(fn){adm(fn).catch(()=>alert('فشلت العملية. تأكد من الكود ومن قواعد Firestore.'))}
async function act(fn){
  try{await adm(fn);return true}
  catch(e){alert('فشلت العملية. تأكد من الكود ومن قواعد Firestore.');return false}
}
async function ownerRun(fn){
  try{const b=db.batch();b.set(db.doc('sessions/owner'),{code:OWNER});fn(b);await b.commit()}
  catch(e){alert('فشلت العملية. تأكد إن OWNER_CODE في Cloudflare نفسه كود الأونر في قواعد Firestore.')}
}

async function roleCall(userId,action){
  try{
    const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:CODE,userId,action})});
    const j=await r.json().catch(()=>({}));
    if(r.ok)return {ok:true};
    if(r.status===403&&!j.status)return {ok:false,why:'كود الأدمن في الـ Worker غير مطابق لكودك'};
    if(j.status===404)return {ok:false,why:'الشخص مو داخل السيرفر'};
    if(j.status===403)return {ok:false,why:'رتبة البوت أقل من الرتبة المطلوبة أو ينقصه صلاحية Manage Roles'};
    return {ok:false,why:'فشل تعديل الرتبة، تأكد من إعدادات البوت'};
  }catch(e){return {ok:false,why:'تعذر الاتصال بالـ Worker'}}
}
async function giveRole(userId,action,manual){
  const r=await roleCall(userId,action);
  if(!r.ok)alert((manual?'':'تم تغيير الحالة، لكن ')+r.why+'.');
  else if(manual)alert('تم ✅');
}
function nameOf(id){const d=docs.find(d=>d.data().discordId===id);return d?d.data().discord:id}
function renderProg(){const p=$('prog');if(p)p.textContent=prog}
async function bulk(ids,action){
  ids=[...new Set(ids)];
  if(!ids.length)return alert('ما فيه أحد.');
  const word=action==='add'?'إعطاء الرتبة':'سحب الرتبة';
  if(!confirm(word+' لعدد '+ids.length+' شخص؟'))return;
  let ok=0;const fails=[];
  for(let i=0;i<ids.length;i++){
    prog=word+': '+(i+1)+' / '+ids.length+' ...';renderProg();
    const r=await roleCall(ids[i],action);
    if(r.ok)ok++;else{fails.push(nameOf(ids[i])+' ('+r.why+')');if(r.why.startsWith('كود'))break}
    await new Promise(s=>setTimeout(s,500));
  }
  prog='انتهى: نجح '+ok+' / فشل '+fails.length;renderProg();
  if(fails.length)alert('فشل مع:\n'+fails.join('\n'));
}

async function login(code){
  CODE=code;$('err').textContent='';
  try{
    await adm(b=>b.set(db.doc('meta/ping'),{t:Date.now()}));
    sessionStorage.setItem('c',CODE);start();
  }catch(e){sessionStorage.removeItem('c');sessionStorage.removeItem('o');OWNER='';$('err').textContent='الكود غلط أو القواعد غير منشورة. ('+e.code+')'}
}
$('go').onclick=()=>{OWNER='';sessionStorage.removeItem('o');login($('pass').value)};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').onclick()});
$('dl').onclick=()=>{
  if(CLIENT_ID.startsWith('PUT_'))return alert('حط Client ID حق ديسكورد في الكود.');
  location.href='https://discord.com/oauth2/authorize?client_id='+CLIENT_ID+'&response_type=token&redirect_uri='+encodeURIComponent(ADMIN_REDIRECT)+'&scope=identify';
};
$('out').onclick=()=>{sessionStorage.removeItem('c');sessionStorage.removeItem('o');location.reload()};
$('tg').onclick=()=>run(b=>b.set(db.doc('settings/config'),{open:!isOpen}));
$('ownerBtn').onclick=()=>$('ownerBox').classList.toggle('hide');
$('aadd').onclick=()=>{
  const id=$('aid').value.trim(),name=$('aname').value.trim().replace(/\|/g,'')||'بدون اسم';
  if(!/^\d{5,25}$/.test(id))return alert('اكتب Discord ID صحيح (أرقام فقط).');
  if(admins.some(a=>a.split('|')[0]===id))return alert('هذا الشخص موجود في القائمة.');
  ownerRun(b=>b.set(db.doc('adminlist/main'),{users:firebase.firestore.FieldValue.arrayUnion(id+'|'+name)},{merge:true}));
  $('aid').value='';$('aname').value='';
};

(async()=>{
  const t=new URLSearchParams(location.hash.slice(1)).get('access_token');
  if(t){
    history.replaceState(null,'',location.pathname);
    $('err').style.color='#aab4c4';$('err').textContent='جاري التحقق من رتبتك...';
    try{
      const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',token:t})});
      const j=await r.json().catch(()=>({}));
      $('err').style.color='';
      if(r.ok&&j.code){
        if(j.ownerCode){OWNER=j.ownerCode;sessionStorage.setItem('o',OWNER)}
        else{OWNER='';sessionStorage.removeItem('o')}
        return login(j.code);
      }
      $('err').textContent=r.status===403?'حسابك ما عنده صلاحية دخول اللوحة (أو مو داخل السيرفر).':'فشل التحقق عبر ديسكورد.';
    }catch(e){$('err').style.color='';$('err').textContent='تعذر الاتصال بالـ Worker.'}
    return;
  }
  const saved=sessionStorage.getItem('c');
  if(saved){OWNER=sessionStorage.getItem('o')||'';login(saved)}
})();

function start(){
  $('login').classList.add('hide');$('panel').classList.remove('hide');
  db.collection('applications').orderBy('createdAt','desc').onSnapshot(s=>{docs=s.docs;render()});
  db.collection('bans').onSnapshot(s=>{bans={};s.forEach(d=>bans[d.id]=d.data().ip);render()});
  db.doc('settings/config').onSnapshot(s=>{isOpen=!s.exists||s.data().open!==false;render()});
  if(OWNER){
    $('ownerBtn').classList.remove('hide');
    db.doc('adminlist/main').onSnapshot(s=>{admins=s.exists?(s.data().users||[]):[];renderAdmins()});
  }
}

function renderAdmins(){
  const l=$('adminList');l.replaceChildren();
  if(!admins.length){const e=el('div','f','لا يوجد أحد في القائمة بعد.');e.style.color='var(--muted)';l.append(e);return}
  admins.forEach(a=>{
    const i=a.indexOf('|'),id=i<0?a:a.slice(0,i),name=i<0?'':a.slice(i+1);
    const r=el('div','row');r.style.cssText='margin:8px 0 0;border-top:1px solid var(--line);padding-top:8px';
    const n=el('b','',name||'بدون اسم');n.style.flex='1';
    r.append(n,el('span','ip',id));
    const d=el('button','no','حذف');
    d.onclick=()=>{if(confirm('حذف '+(name||id)+' من قائمة الأدمن؟'))ownerRun(b=>b.set(db.doc('adminlist/main'),{users:firebase.firestore.FieldValue.arrayRemove(a)},{merge:true}))};
    r.append(d);l.append(r);
  });
}

function render(){
  $('tg').textContent=isOpen?'🔒 قفل التقديم':'🔓 فتح التقديم';
  $('tg').className=isOpen?'no':'ok';
  const tabs=$('tabs');tabs.replaceChildren();
  for(const k in LABELS){
    const n=k==='all'?docs.length:k==='bans'?Object.keys(bans).length:docs.filter(d=>d.data().status===k).length;
    const b=el('button','tab ghost'+(filter===k?' on':''),`${LABELS[k]} (${n})`);
    b.onclick=()=>{filter=k;prog='';render()};tabs.append(b);
  }
  const list=$('list');list.replaceChildren();
  if(filter==='bans'){
    const ks=Object.keys(bans);
    if(!ks.length)list.append(el('div','card','لا يوجد محظورين.'));
    ks.forEach(k=>{
      const c=el('div','card row');c.style.marginBottom='12px';
      c.append(el('span','ip',bans[k]||k));
      const u=el('button','ok','فك الحظر');
      u.onclick=()=>run(b=>b.delete(db.doc('bans/'+k)));
      c.append(u);list.append(c);
    });
    return;
  }
  if(filter==='accepted'){
    const acc=()=>docs.filter(d=>d.data().status==='accepted'&&d.data().discordId).map(d=>d.data().discordId);
    const t=el('div','card'),r1=el('div','row');
    const mk=(txt,cls,fn)=>{const b=el('button',cls,txt);b.onclick=fn;r1.append(b)};
    mk('✅ إعطاء الرتبة للكل','ok',()=>bulk(acc(),'add'));
    mk('❌ سحب الرتبة من الكل','no',()=>bulk(acc(),'remove'));
    mk('إعطاء الرتبة للمحددين','ok',()=>bulk([...sel],'add'));
    mk('سحب الرتبة من المحددين','no',()=>bulk([...sel],'remove'));
    mk('تحديد الكل','ghost',()=>{acc().forEach(i=>sel.add(i));render()});
    mk('إلغاء التحديد','ghost',()=>{sel.clear();render()});
    t.append(r1);
    const p=el('div','f');p.id='prog';p.textContent=prog||('المحدد: '+sel.size);
    t.append(p);list.append(t);
  }
  const shown=docs.filter(d=>filter==='all'||d.data().status===filter);
  if(!shown.length)list.append(el('div','card','لا توجد طلبات.'));
  for(const d of shown){
    const x=d.data(),c=el('div','card'),h=el('div','row');
    h.style.marginBottom='8px';
    if(filter==='accepted'&&x.discordId){
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=sel.has(x.discordId);
      cb.style.cssText='width:20px;height:20px;margin:0;padding:0;accent-color:#d4af37';
      cb.onchange=()=>{cb.checked?sel.add(x.discordId):sel.delete(x.discordId);if(!prog){const p=$('prog');if(p)p.textContent='المحدد: '+sel.size}};
      h.append(cb);
    }
    h.append(el('b','',x.discord),el('span','badge '+x.status,LABELS[x.status]||x.status));
    if(x.canRetry)h.append(el('span','badge retry','لديه فرصة جديدة'));
    if((x.ipKey&&bans[x.ipKey])||(x.discordId&&bans['d_'+x.discordId]))h.append(el('span','badge banned','محظور'));
    c.append(h);
    [['اسم الماب',x.ingame],['العمر',x.age],['الساعات',x.hours],['الخبرة',x.experience],['السبب',x.reason]].forEach(([k,v])=>{
      const r=el('div','f');r.append(el('b','',k+': '),document.createTextNode(v??''));c.append(r);
    });
    const ipr=el('div','f');ipr.append(el('b','','IP: '),el('span','ip',x.ip||'—'));c.append(ipr);
    if(x.discordId){const di=el('div','f');di.append(el('b','','Discord ID: '),el('span','ip',x.discordId));c.append(di)}
    const a=el('div','row');a.style.margin='12px 0 0';
    const ref=()=>db.doc('applications/'+d.id);
    const ok=el('button','ok','قبول'),no=el('button','no','رفض'),rt=el('button','warn','فرصة جديدة');
    ok.onclick=async()=>{
      if(!await act(b=>b.update(ref(),{status:'accepted',canRetry:false})))return;
      if(x.discordId)giveRole(x.discordId,'add');
      else alert('تم القبول، لكن هذا طلب قديم بدون حساب ديسكورد، فما يقدر البوت يعطيه رتبة.');
    };
    no.onclick=async()=>{
      if(!await act(b=>b.update(ref(),{status:'rejected',canRetry:false})))return;
      if(x.status==='accepted'&&x.discordId)giveRole(x.discordId,'remove');
    };
    rt.onclick=()=>run(b=>b.update(ref(),{canRetry:true}));
    a.append(ok,no,rt);
    if(x.status==='accepted'&&x.discordId){
      const ga=el('button','ok','إعطاء رتبة'),ra=el('button','ghost','سحب رتبة');
      ga.onclick=()=>giveRole(x.discordId,'add',true);
      ra.onclick=()=>giveRole(x.discordId,'remove',true);
      a.append(ga,ra);
    }
    if(x.ipKey){
      const isB=!!bans[x.ipKey],bn=el('button',isB?'ghost':'no',isB?'فك حظر IP':'حظر IP');
      bn.onclick=()=>run(b=>isB?b.delete(db.doc('bans/'+x.ipKey)):b.set(db.doc('bans/'+x.ipKey),{ip:x.ip}));
      a.append(bn);
    }
    if(x.discordId){
      const k='d_'+x.discordId,isA=!!bans[k],ba=el('button',isA?'ghost':'no',isA?'فك حظر الحساب':'حظر الحساب');
      ba.onclick=()=>run(b=>isA?b.delete(db.doc('bans/'+k)):b.set(db.doc('bans/'+k),{ip:'حساب: '+x.discord+' ('+x.discordId+')'}));
      a.append(ba);
    }
    c.append(a);list.append(c);
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#1a1e33;--text:#eef0f8;--muted:#9aa0b8;--accent:#6c7cff;--line:#2a2f4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',Tahoma,sans-serif;padding:24px 14px}
.wrap{max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
input{width:100%;background:#12152a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit;margin-bottom:10px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
.ok{background:#1f9d55}.no{background:#d64545}.ghost{background:#2a2f4d}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tab.on{background:var(--accent)}
.f{margin:6px 0}.f b{color:var(--muted);font-weight:400}
.badge{padding:2px 10px;border-radius:20px;font-size:13px}
.pending{background:#5a4b10}.accepted{background:#14532d}.rejected{background:#5b1c1c}
.hide{display:none}
#err{color:#ff6b6b}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h2>🔐 دخول الإدارة</h2>
    <input id="email" type="email" placeholder="الإيميل" autocomplete="username">
    <input id="pass" type="password" placeholder="الكود / كلمة المرور" autocomplete="current-password">
    <button id="go">دخول</button>
    <div id="err"></div>
  </div>
  <div id="panel" class="hide">
    <div class="row">
      <h2 style="margin:0;flex:1">طلبات المود</h2>
      <button class="ghost" id="out">خروج</button>
    </div>
    <div class="row" id="tabs"></div>
    <div id="list"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=id=>document.getElementById(id);
const LABELS={all:'الكل',pending:'قيد المراجعة',accepted:'مقبول',rejected:'مرفوض'};
let filter='pending',docs=[],unsub=null;

$('go').onclick=async()=>{
  $('err').textContent='';
  try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value)}
  catch(e){$('err').textContent='بيانات الدخول غلط.'}
};
$('out').onclick=()=>auth.signOut();

auth.onAuthStateChanged(u=>{
  if(unsub){unsub();unsub=null}
  $('login').classList.toggle('hide',!!u);
  $('panel').classList.toggle('hide',!u);
  if(!u)return;
  unsub=db.collection('applications').orderBy('createdAt','desc').onSnapshot(
    s=>{docs=s.docs;render()},
    ()=>{$('list').textContent='ما عندك صلاحية. تأكد إن الإيميل هو إيميل الأدمن في قواعد Firestore.'}
  );
});

function setStatus(id,status){db.collection('applications').doc(id).update({status})}
function del(id){if(confirm('تحذف الطلب نهائياً؟'))db.collection('applications').doc(id).delete()}

function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e}

function render(){
  const tabs=$('tabs');tabs.replaceChildren();
  for(const k in LABELS){
    const n=k==='all'?docs.length:docs.filter(d=>d.data().status===k).length;
    const b=el('button','tab ghost'+(filter===k?' on':''),`${LABELS[k]} (${n})`);
    b.onclick=()=>{filter=k;render()};tabs.append(b);
  }
  const list=$('list');list.replaceChildren();
  const shown=docs.filter(d=>filter==='all'||d.data().status===filter);
  if(!shown.length)list.append(el('div','card','لا توجد طلبات.'));
  for(const d of shown){
    const x=d.data(),c=el('div','card');
    const h=el('div','row');
    h.append(el('b','',x.discord),el('span','badge '+x.status,LABELS[x.status]||x.status));
    c.append(h);
    [['اسم الماب',x.ingame],['العمر',x.age],['الساعات',x.hours],['الخبرة',x.experience],['السبب',x.reason]].forEach(([k,v])=>{
      const r=el('div','f');r.append(el('b','',k+': '),document.createTextNode(v??''));c.append(r);
    });
    const a=el('div','row');
    const ok=el('button','ok','قبول'),no=el('button','no','رفض'),rm=el('button','ghost','حذف');
    ok.onclick=()=>setStatus(d.id,'accepted');no.onclick=()=>setStatus(d.id,'rejected');rm.onclick=()=>del(d.id);
    a.append(ok,no,rm);c.append(a);list.append(c);
  }
}
</script>
</body>
</html>

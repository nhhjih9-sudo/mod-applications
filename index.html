<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقديم على مود</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#1a1e33;--text:#eef0f8;--muted:#9aa0b8;--accent:#6c7cff;--line:#2a2f4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',Tahoma,sans-serif;padding:24px 14px}
.wrap{max-width:620px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:26px}
p.sub{color:var(--muted);margin:0}
label{display:block;font-weight:700;margin-bottom:8px}
input,textarea,select{width:100%;background:#12152a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}
textarea{min-height:100px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent)}
.req{color:#ff6b6b}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px 28px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#msg{margin-top:12px;font-weight:700}
.check{display:flex;gap:8px;align-items:center}
.check input{width:auto}
.hide{display:none}
#state{font-size:20px;font-weight:700;text-align:center;padding:36px 22px}
</style>
</head>
<body>
<div class="wrap">
  <div id="state" class="card">جاري التحميل...</div>
  <div id="formBox" class="hide">
    <div class="card" style="border-top:5px solid var(--accent)">
      <h1>🛡️ التقديم على مود</h1>
      <p class="sub">عبّ النموذج بدقة، وبنراجع طلبك. ملاحظة: نسجّل عنوان IP الخاص بك مع الطلب.</p>
    </div>
    <form id="f">
      <div class="card"><label>اسمك في ديسكورد <span class="req">*</span></label><input name="discord" required maxlength="60"></div>
      <div class="card"><label>اسمك داخل الماب <span class="req">*</span></label><input name="ingame" required maxlength="60"></div>
      <div class="card"><label>عمرك <span class="req">*</span></label><input name="age" type="number" min="8" max="80" required></div>
      <div class="card"><label>خبرتك في الإدارة <span class="req">*</span></label><textarea name="experience" required maxlength="800"></textarea></div>
      <div class="card"><label>ليش تبي تصير مود؟ <span class="req">*</span></label><textarea name="reason" required maxlength="800"></textarea></div>
      <div class="card"><label>كم ساعة تقدر تتواجد يومياً؟ <span class="req">*</span></label>
        <select name="hours" required><option value="">اختر</option><option>أقل من ساعة</option><option>1 - 3 ساعات</option><option>3 - 5 ساعات</option><option>أكثر من 5 ساعات</option></select></div>
      <div class="card check"><input type="checkbox" id="agree" required><label for="agree" style="margin:0">أوافق على القوانين وأتعهد بالالتزام بها</label></div>
      <button id="btn" type="submit">إرسال الطلب</button>
      <div id="msg"></div>
    </form>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=id=>document.getElementById(id);
let IP='',KEY='';
function show(t,c){const s=$('state');s.classList.remove('hide');s.textContent=t;s.style.borderColor=c||'';$('formBox').classList.add('hide')}
function showForm(){$('state').classList.add('hide');$('formBox').classList.remove('hide')}

(async()=>{
  try{IP=(await (await fetch('https://api.ipify.org?format=json')).json()).ip}
  catch(e){return show('تعذر التحقق من اتصالك. عطّل مانع الإعلانات وحدّث الصفحة.')}
  KEY=IP.replace(/[.:]/g,'_');
  try{
    if((await db.doc('bans/'+KEY).get()).exists)return show('🚫 تم حظرك من التقديم.','#d64545');
    const q=await db.collection('applications').where('ipKey','==',KEY).get();
    let last=null;
    q.forEach(d=>{const x=d.data(),t=x.createdAt?x.createdAt.toMillis():Infinity;if(!last||t>last.t)last={x,t}});
    if(last&&!last.x.canRetry){
      const s=last.x.status;
      if(s==='accepted')return show('🎉 مبروك! تم قبول طلبك.','#1f9d55');
      if(s==='rejected')return show('❌ نأسف، تم رفض طلبك.','#d64545');
      return show('⏳ طلبك قيد المراجعة، انتظر الرد.');
    }
    const cfg=await db.doc('settings/config').get();
    if(cfg.exists&&cfg.data().open===false)return show('🔒 التقديم مغلق حالياً.');
    showForm();
  }catch(e){show('صار خطأ في التحميل، حدّث الصفحة.')}
})();

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('btn'),msg=$('msg');
  btn.disabled=true;msg.style.color='';msg.textContent='جاري الإرسال...';
  const d=Object.fromEntries(new FormData($('f')));
  d.age=Number(d.age);d.ip=IP;d.ipKey=KEY;d.status='pending';
  d.createdAt=firebase.firestore.FieldValue.serverTimestamp();
  try{
    await db.collection('applications').add(d);
    show('✅ تم إرسال طلبك! افتح الموقع لاحقاً وشوف حالة طلبك.','#1f9d55');
  }catch(err){btn.disabled=false;msg.style.color='#ff6b6b';msg.textContent='صار خطأ، يمكن التقديم مقفل أو أنت محظور.'}
});
</script>
</body>
</html>
